name: Content Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/articles/*.md'
      - 'content/articles/*.mdx'
      - 'scripts/validate-articles.ts'
  push:
    branches:
      - main
    paths:
      - 'content/articles/*.md'
      - 'content/articles/*.mdx'
      - 'scripts/validate-articles.ts'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Articles

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run article validation
        run: npm run validate

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: content/articles/*.md

      - name: Score changed articles
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $file == content/articles/*.md ]]; then
              echo "---"
              echo "📊 Scoring: $file"
              npm run score "$file" 2>&1 | tail -20
            fi
          done

      - name: Comment PR with scores
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split('\n');
            let comment = '## 📋 Article Quality Report\n\n';

            changedFiles.forEach(file => {
              if (file.endsWith('.md') && file.startsWith('content/articles/')) {
                try {
                  const output = execSync(`npm run score "${file}"`, { encoding: 'utf-8' });
                  // Extract score from output
                  const scoreMatch = output.match(/Article Quality Score: (\d+)\/100/);
                  if (scoreMatch) {
                    const score = parseInt(scoreMatch[1]);
                    const slug = path.basename(file, '.md');
                    const emoji = score >= 90 ? '✨' : score >= 75 ? '✓' : score >= 60 ? '⚠️' : '❌';
                    comment += `${emoji} **${slug}**: ${score}/100\n`;
                  }
                } catch (e) {
                  // Silently skip files that fail
                }
              }
            });

            if (comment.length > 35) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
