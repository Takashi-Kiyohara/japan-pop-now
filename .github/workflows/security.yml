name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan Monday 03:00 JST (Sunday 18:00 UTC)
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Audit (high+)
        run: |
          npm audit --audit-level=high --json > audit.json || true
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit.json)
          CRIT=$(jq '.metadata.vulnerabilities.critical // 0' audit.json)
          echo "High: $HIGH | Critical: $CRIT"
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::$CRIT critical vulnerability/ies found"
            jq '.vulnerabilities | to_entries[] | select(.value.severity == "critical") | {name: .key, via: .value.via}' audit.json
            exit 1
          fi

      - name: Open issue on high/critical
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs')
            const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'))
            const vulns = audit.metadata?.vulnerabilities || {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security: npm audit found ${vulns.critical || 0} critical / ${vulns.high || 0} high`,
              body: `Auto-generated by .github/workflows/security.yml\n\nRun: \`npm audit\` locally to investigate.`,
              labels: ['security', 'dependencies']
            })

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # full history needed for CodeQL pr-diff-range extension
      - name: Init CodeQL
        uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
