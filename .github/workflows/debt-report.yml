name: Weekly Debt Report

# Snapshots scripts/debt-report.ts output (debt-report.json) every Sunday and
# commits the diff so we can track tech-debt trend over time. Manual dispatch
# is also supported via the Actions tab.

on:
  schedule:
    - cron: '0 0 * * 0'  # Sunday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run debt report
        run: npm run debt-report

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debt-report.json
          if git diff --cached --quiet; then
            echo "No debt-report changes — skipping commit."
          else
            git commit -m "chore(debt): weekly snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
