name: AI detection gate

# Bucket C5 of v3 adoption — runs `scripts/ai-detection/check-article.ts`
# on every changed `content/articles/*.mdx` in a PR. Fails the job (and
# blocks the PR if this check is required in branch protection) when any
# changed article scores composite >= 30.
#
# Threshold 30 is the SHIP / FIX_LAYER boundary defined in
# `.claude/skills/jpn-anti-ai-detection/SKILL.md`. Re-tune after Bucket
# C3 baseline calibration lands at `docs/research/human-baseline-20260428.json`.

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/articles/**'
      - 'scripts/ai-detection/**'
      - '.github/workflows/ai-detection-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    name: AI-detection score gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # need merge-base for git diff against origin/main

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Find changed articles
        id: changed
        run: |
          set -euo pipefail
          # Compute merge-base against the PR's base branch (main).
          BASE_SHA=$(git merge-base origin/main HEAD)
          CANDIDATES=$(git diff --name-only --diff-filter=AMR "${BASE_SHA}" HEAD -- 'content/articles/*.mdx' 'content/articles/*.md' || true)
          if [ -z "${CANDIDATES}" ]; then
            echo "No article changes detected — gate is a no-op."
            echo "files=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Body-diff filter: the gate scores article PROSE only (gray-matter
          # `.content`), never frontmatter. An article whose only change is a
          # frontmatter field (e.g. `author:`) has a byte-identical body, so
          # its composite score cannot differ — re-scoring it is redundant.
          # Keep only articles whose post-frontmatter body actually changed;
          # new/renamed articles have no base body and are always kept.
          extract_body() {
            awk 'BEGIN{c=0} /^---[[:space:]]*$/{c++; next} c>=2{print}'
          }
          CHANGED=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            head_body="$(extract_body < "$f" 2>/dev/null || true)"
            base_body="$(git show "${BASE_SHA}:${f}" 2>/dev/null | extract_body || true)"
            if [ "$head_body" != "$base_body" ]; then
              CHANGED="${CHANGED}${f}"$'\n'
            else
              echo "Skip ${f} — frontmatter-only change, body unchanged (score cannot differ)."
            fi
          done <<< "${CANDIDATES}"
          CHANGED="$(printf '%s' "${CHANGED}" | sed '/^[[:space:]]*$/d')"
          if [ -z "${CHANGED}" ]; then
            echo "All changed articles are frontmatter-only — gate is a no-op."
            echo "files=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Articles to score (body changed):"
          echo "${CHANGED}"
          # Multi-line output via heredoc syntax
          {
            echo 'files<<EOF'
            echo "${CHANGED}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Score changed articles
        if: steps.changed.outputs.files != ''
        run: |
          set -uo pipefail
          # Hybrid gate logic lives in scripts/audit/ai-detection-gate.ts.
          # 4-tier decision (L1/L2/L3/L4) + 5 escape hatches; the workflow
          # only inspects `.blocked` from the wrapper's JSON output.
          # See docs/policy/l4-calibration-hybrid-20260429.md for the full
          # spec including the L4 threshold (composite ≥ 70) and hatch list.
          FAIL=0
          REPORT_LINES=()
          REPORT_LINES+=("# AI-detection gate report (hybrid policy)")
          REPORT_LINES+=("")
          REPORT_LINES+=("Wrapper: \`scripts/audit/ai-detection-gate.ts\`. Spec: docs/policy/l4-calibration-hybrid-20260429.md.")
          REPORT_LINES+=("")
          REPORT_LINES+=("| Article | Composite | Level | Blocked? | Hatch (if any) | Dominant |")
          REPORT_LINES+=("| --- | ---: | --- | :-: | --- | :-: |")

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            slug="$(basename "$f" | sed -E 's/\.(mdx|md)$//')"
            JSON=$(npx tsx scripts/audit/ai-detection-gate.ts "${slug}" --json 2>&1) || {
              # Wrapper exits 1 only when blocked; capture stdout (json) regardless
              :
            }
            # Strip non-JSON noise (--json prints clean to stdout)
            COMP=$(echo "${JSON}" | jq -r '.composite' 2>/dev/null) || COMP=""
            LEVEL=$(echo "${JSON}" | jq -r '.level' 2>/dev/null) || LEVEL=""
            BLOCKED=$(echo "${JSON}" | jq -r '.blocked' 2>/dev/null) || BLOCKED=""
            HATCH=$(echo "${JSON}" | jq -r '.escapeHatchTriggered // "—"' 2>/dev/null) || HATCH="—"
            DOM=$(echo "${JSON}" | jq -r '.dominantLayer' 2>/dev/null) || DOM=""
            if [ -z "${COMP}" ] || [ -z "${LEVEL}" ]; then
              echo "::error file=${f}::Hybrid gate script failed for ${slug}: ${JSON}"
              FAIL=1
              continue
            fi
            REPORT_LINES+=("| ${slug} | ${COMP} | ${LEVEL} | ${BLOCKED} | ${HATCH} | L${DOM} |")
            if [ "${BLOCKED}" = "true" ]; then
              echo "::warning file=${f}::AI-detection hybrid gate BLOCKED ${slug} (composite ${COMP}, ${LEVEL}, no escape hatch passed)"
              FAIL=1
            else
              echo "${slug}: composite ${COMP} (${LEVEL}) — pass${HATCH:+ via ${HATCH}}."
            fi
          done <<< "${{ steps.changed.outputs.files }}"

          {
            for line in "${REPORT_LINES[@]}"; do
              echo "${line}"
            done
          } > ai-detection-report.md
          echo "----- ai-detection-report.md -----"
          cat ai-detection-report.md
          echo "----- end report -----"

          if [ "${FAIL}" -ne 0 ]; then
            echo "::error::Hybrid gate blocked one or more changed articles. See report artifact + per-article warnings."
            echo "::error::Options: (a) revise the article's prose, (b) add `voice:` frontmatter + signature phrase, (c) add `ai_audit_override: \"human-verified-by-takapon-YYYY-MM-DD\"` after manual review."
            exit 1
          fi
          echo "All changed articles passed the hybrid AI-detection gate."

      - name: Upload report
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ai-detection-report
          path: ai-detection-report.md
          if-no-files-found: ignore
          retention-days: 14
