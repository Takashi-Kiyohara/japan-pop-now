name: Klook Compliance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'content/articles/**'
      - 'scripts/audit/**'
      - '.github/workflows/klook-compliance.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'content/articles/**'
      - 'scripts/audit/**'
      - '.github/workflows/klook-compliance.yml'
  workflow_dispatch:

jobs:
  klook-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check 1 - no aff_id short form in source code
        run: |
          set +e
          hits=$(grep -rn "aff_id=" app/ components/ lib/ --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' 2>/dev/null | grep -v "//" | grep -v "klook-compliance" | grep -v "klook-gate")
          if [ -n "$hits" ]; then
            echo "::error::Found aff_id= short form in source code. Use aff_adid= (canonical Klook param)."
            echo "$hits"
            exit 1
          fi
          echo "OK source code"

      - name: Check 2 - no aff_id short form in articles
        run: |
          set +e
          hits=$(grep -rn "[?&]aff_id=[0-9]" content/articles/ --include='*.md' --include='*.mdx' 2>/dev/null | grep -v ".deprecated")
          if [ -n "$hits" ]; then
            echo "::error::Found aff_id= short form in articles. Use aff_adid= (canonical Klook param)."
            echo "$hits"
            exit 1
          fi
          echo "OK articles"

      - name: Check 3 - markdown klook links must include aff_adid
        run: |
          set +e
          # Match markdown form [text](https://...klook.com...) and require aff_adid in the URL
          hits=$(grep -rnoE '\[[^]]+\]\(https?://(www\.|affiliate\.)?klook\.com[^)]*\)' content/articles/ --include='*.md' --include='*.mdx' 2>/dev/null | grep -v ".deprecated" | grep -v "aff_adid=")
          if [ -n "$hits" ]; then
            echo "::error::Found markdown klook link without aff_adid. Add ?aff_adid=1251547."
            echo "$hits"
            exit 1
          fi
          echo "OK markdown klook links"

      - name: Check 4 - HTML anchor klook links must include aff_adid
        run: |
          set +e
          # Match <a href="https://...klook.com..."> and require aff_adid in the URL
          hits=$(grep -rnoE 'href="https?://(www\.|affiliate\.)?klook\.com[^"]*"' content/articles/ --include='*.md' --include='*.mdx' 2>/dev/null | grep -v ".deprecated" | grep -v "aff_adid=")
          if [ -n "$hits" ]; then
            echo "::error::Found HTML anchor klook link without aff_adid. Add ?aff_adid=1251547."
            echo "$hits"
            exit 1
          fi
          echo "OK HTML klook anchors"

      - name: Summary
        run: echo "Klook compliance OK - aff_adid canonical param verified across source + articles."
