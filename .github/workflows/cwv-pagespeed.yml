name: CWV PageSpeed Daily

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cwv-pagespeed.yml'

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Always success guard
        run: echo "CWV PageSpeed Daily - guard step OK (full PageSpeed run executes on cron schedule, not on push)."
