name: Cycle D' Day 1 (24h post-2026-05-06 fix verify)

# Fires once at 2026-05-07 11:00 UTC, then by manual dispatch.
# Runs the redirect chain trace + canonical/robots/sitemap drift detection
# and posts the result to docs/audit/.

on:
  schedule:
    - cron: '0 11 7 5 *'   # 2026-05-07 11:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Date stamp
        id: stamp
        run: echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Redirect chain proxy trace
        run: |
          mkdir -p docs/audit
          bash scripts/audit/redirect-chain-full-trace.sh > "docs/audit/cycleD-day1-redirect-${{ steps.stamp.outputs.DATE }}.md" || true

      - name: Internal-link graph audit
        run: npx tsx scripts/audit/internal-pagerank.ts > "docs/audit/cycleD-day1-graph-${{ steps.stamp.outputs.DATE }}.md" || true

      - name: Originality cosine audit
        run: npx tsx scripts/audit/originality-cosine.ts > "docs/audit/cycleD-day1-originality-${{ steps.stamp.outputs.DATE }}.md" || true

      - name: 4xx surface scan
        run: |
          curl -sL https://www.japan-pop-now.com/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | sed 's/<\/\?loc>//g' > /tmp/sitemap.txt
          non200=$(xargs -I{} -P 20 -n 1 curl -sIL -A "Googlebot/2.1" -o /dev/null -w "%{http_code} {}\n" {} < /tmp/sitemap.txt 2>&1 | grep -vE '^200 ' | head -50)
          {
            echo "# Cycle D' Day 1 — 4xx surface scan"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ -z "$non200" ]; then
              echo "✓ All sitemap URLs return 200."
            else
              echo "⚠ Non-200 sitemap URLs (P0):"
              echo
              echo '```'
              echo "$non200"
              echo '```'
            fi
          } > "docs/audit/cycleD-day1-4xx-${{ steps.stamp.outputs.DATE }}.md"

      - name: Cycle D' Day 1 summary + flag
        run: |
          {
            echo "cycleD' Day 1 complete: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "trigger: scheduled cron"
            echo "checks: redirect-proxy / link-graph / originality / 4xx-surface"
            echo "next: Day 2 cron at 2026-05-08T11:00Z"
          } > docs/audit/cycleD-day1-DONE.flag

      - name: Open Issue on regression
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[cycleD'] Day 1 verify failed — regression detected`,
              body: `Day 1 scheduled verify ran at ${new Date().toISOString()} and one or more checks failed.\n\nSee https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.\n\nLikely causes: chain trace ≥3 hops, 4xx URL in sitemap, originality regression. Triage P0.`,
              labels: ['cycleD', 'P0', 'regression']
            });

      - name: Commit audit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit/cycleD-day1-* || true
          git diff --cached --quiet || git commit -m "[cycleD'-day1] auto: scheduled redirect/graph/originality/4xx audit"
          git push
