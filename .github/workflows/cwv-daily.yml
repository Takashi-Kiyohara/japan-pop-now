name: CWV retry (PageSpeed Insights, +24h after quota exhaust)

# Cycle E3 — retry CWV measurement once daily PageSpeed quota refreshes.
# Fires at 2026-05-07 11:00 UTC (matches the Day 1 cron) and then daily.
# Posts results, opens Issue on Good <75%.

on:
  schedule:
    - cron: '15 11 * * *'  # daily at 11:15 UTC; close to Day 1 trigger
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # Always-succeeds fallback so push-triggered phantom runs do not show as failure.
  # When CI runs on push (not schedule / workflow_dispatch), the cwv job is skipped
  # via its if: clause and only this no-op job records a success conclusion.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Note event
        run: |
          echo "Triggered by ${{ github.event_name }}; cwv job runs only on schedule/workflow_dispatch."

  cwv:
    needs: guard
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Date stamp
        id: stamp
        run: echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Run PageSpeed Insights on 5 representative URLs (mobile)
        run: |
          set +e
          DATE="${{ steps.stamp.outputs.DATE }}"
          OUT="docs/audit/cycleE-cwv-$DATE.md"
          mkdir -p docs/audit

          {
            echo "# [cycleE3] Mobile Core Web Vitals (PageSpeed Insights)"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Strategy: mobile"
            echo
            echo "| URL | Performance | LCP | FCP | CLS | TBT/INP |"
            echo "|---|---|---|---|---|---|"
          } > "$OUT"

          violations=0
          for u in \
            "https://www.japan-pop-now.com/" \
            "https://www.japan-pop-now.com/articles/akihabara-complete-guide-2026" \
            "https://www.japan-pop-now.com/articles/lawson-ticket-anime-cafe-booking" \
            "https://www.japan-pop-now.com/calendar" \
            "https://www.japan-pop-now.com/category/cafes"
          do
            r=$(curl -s --max-time 60 "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=$u&strategy=mobile&category=performance" 2>/dev/null)
            err=$(echo "$r" | python3 -c "import json,sys
try:
  d=json.load(sys.stdin)
  print(d.get('error',{}).get('message',''))
except Exception as e:
  print(f'parse_err: {e}')" 2>&1 | head -1)
            if [ -n "$err" ] && [ "$err" != "" ]; then
              echo "| $u | ERROR: $err | | | | |" >> "$OUT"
              continue
            fi
            perf=$(echo "$r" | python3 -c "import json,sys;d=json.load(sys.stdin);c=d.get('lighthouseResult',{}).get('categories',{}).get('performance',{}).get('score',-1);print(f'{c*100 if c >= 0 else 0:.0f}')" 2>&1)
            lcp=$(echo "$r" | python3 -c "import json,sys;a=json.load(sys.stdin).get('lighthouseResult',{}).get('audits',{});print(a.get('largest-contentful-paint',{}).get('displayValue','n/a'))" 2>&1)
            fcp=$(echo "$r" | python3 -c "import json,sys;a=json.load(sys.stdin).get('lighthouseResult',{}).get('audits',{});print(a.get('first-contentful-paint',{}).get('displayValue','n/a'))" 2>&1)
            cls=$(echo "$r" | python3 -c "import json,sys;a=json.load(sys.stdin).get('lighthouseResult',{}).get('audits',{});print(a.get('cumulative-layout-shift',{}).get('displayValue','n/a'))" 2>&1)
            tbt=$(echo "$r" | python3 -c "import json,sys;a=json.load(sys.stdin).get('lighthouseResult',{}).get('audits',{});print(a.get('total-blocking-time',{}).get('displayValue','n/a'))" 2>&1)
            echo "| $u | $perf | $lcp | $fcp | $cls | $tbt |" >> "$OUT"
            if [ -n "$perf" ] && [ "$perf" -lt 75 ] 2>/dev/null; then
              violations=$((violations + 1))
            fi
          done

          {
            echo
            echo "## Verdict"
            if [ "$violations" -eq 0 ]; then
              echo "✓ Performance score ≥ 75 across all sampled URLs."
            else
              echo "⚠ $violations URLs scored < 75 Performance. P1 — investigate LCP/CLS."
            fi
          } >> "$OUT"

          cat "$OUT"

          # Set output for next step
          echo "VIOLATIONS=$violations" >> "$GITHUB_OUTPUT"
        id: cwv

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit/cycleE-cwv-*.md || true
          git diff --cached --quiet || git commit -m "[cycleE3] auto: PSI Core Web Vitals snapshot"
          git push

      - name: Open Issue on violations
        if: steps.cwv.outputs.VIOLATIONS != '0' && steps.cwv.outputs.VIOLATIONS != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[cycleE3] CWV regression — performance < 75 on ${{ steps.cwv.outputs.VIOLATIONS }} URL(s)`,
              body: `Daily PageSpeed Insights snapshot (run ${{ github.run_id }}) flagged URLs with Performance score < 75.\n\nSee docs/audit/cycleE-cwv-{date}.md for the breakdown. Triage P1 — focus on LCP / CLS.`,
              labels: ['cwv', 'P1']
            });
